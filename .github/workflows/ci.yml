name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Lint
        run: npx --yes eslint@10.12.0 .
      - name: Check referenced assets exist
        run: node scripts/check-assets.mjs
